  <text x="292.5" y="90" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="292.5" dy="0">User picks an image</tspan>
    <tspan x="292.5" dy="20">and answers consent</tspan>
  </text>
  <text x="292.5" y="278" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="292.5" dy="0">POST /images/search</tspan>
    <tspan x="292.5" dy="20">?user_consent=true or false</tspan>
  </text>
  <text x="292.5" y="464" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="292.5" dy="0">Check MinIO bucket is up</tspan>
  </text>
  <text x="292.5" y="628" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="292.5" dy="0">Consent given?</tspan>
  </text>
  <text x="195" y="794" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="195" dy="0">Upload to MinIO +</tspan>
    <tspan x="195" dy="20">add PENDING row in Postgres</tspan>
  </text>
  <text x="195" y="982" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="195" dy="0">Run ingestion now</tspan>
    <tspan x="195" dy="20">(if CRONS = false)</tspan>
  </text>
  <text x="292.5" y="1168" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="292.5" dy="0">CLIP: image to embedding</tspan>
  </text>
  <text x="292.5" y="1334" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="292.5" dy="0">Milvus: top K similar IDs</tspan>
    <tspan x="292.5" dy="20">(cosine)</tspan>
  </text>
  <text x="292.5" y="1522" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="292.5" dy="0">Postgres: IDs to object paths</tspan>
    <tspan x="292.5" dy="20">MinIO: presigned URLs</tspan>
  </text>
  <text x="292.5" y="1708" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="292.5" dy="0">Return results: [urls]</tspan>
  </text>
  <text x="243.75" y="709.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
    <tspan x="243.75" dy="0">yes</tspan>
  </text>
