<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 788" width="690" height="788">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e" />
    </marker>
  </defs>
  <rect x="0" y="0" width="690" height="788" fill="#ffffff" />
  <rect x="40" y="340" width="240" height="252" rx="8" ry="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" opacity="1" />
  <rect x="360" y="40" width="290" height="276" rx="8" ry="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" opacity="1" />
  <rect x="375" y="376" width="260" height="180" rx="8" ry="8" fill="#d0bfff" stroke="#7048e8" stroke-width="2" opacity="1" />
  <rect x="390" y="616" width="230" height="132" rx="8" ry="8" fill="#d0bfff" stroke="#7048e8" stroke-width="2" opacity="1" />
  <polyline points="280,466 360,178" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="280,466 375,466" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <polyline points="280,466 390,682" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="160" y="402" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="160" dy="0">image_registry</tspan>
    <tspan x="160" dy="20">--------------</tspan>
    <tspan x="160" dy="20">id (UUID, PK)</tspan>
    <tspan x="160" dy="20">object_path (unique)</tspan>
    <tspan x="160" dy="20">status</tspan>
    <tspan x="160" dy="20">content_type</tspan>
    <tspan x="160" dy="20">consent_type</tspan>
    <tspan x="160" dy="20">created_at</tspan>
  </text>
  <text x="505" y="104" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="505" dy="0">image_metadata</tspan>
    <tspan x="505" dy="20">--------------</tspan>
    <tspan x="505" dy="20">id (UUID, PK)</tspan>
    <tspan x="505" dy="20">image_registry_id (FK)</tspan>
    <tspan x="505" dy="20">file_name, mime_type</tspan>
    <tspan x="505" dy="20">file_size_bytes</tspan>
    <tspan x="505" dy="20">sha256_hash (unique)</tspan>
    <tspan x="505" dy="20">perceptual_hash</tspan>
    <tspan x="505" dy="20">image_width, image_height</tspan>
  </text>
  <text x="505" y="432" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="505" dy="0">Milvus collection</tspan>
    <tspan x="505" dy="20">--------------</tspan>
    <tspan x="505" dy="20">id (= registry id)</tspan>
    <tspan x="505" dy="20">embedding (512 floats)</tspan>
    <tspan x="505" dy="20">COSINE index</tspan>
  </text>
  <text x="505" y="668" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="505" dy="0">MinIO bucket</tspan>
    <tspan x="505" dy="20">--------------</tspan>
    <tspan x="505" dy="20">YYYY-MM-DD/uuid.ext</tspan>
  </text>
  <text x="320" y="327.25" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle">
